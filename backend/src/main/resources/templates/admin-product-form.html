<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Product | Siddhi Paithani Admin</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #800020;
            --primary-dark: #5c0017;
            --accent: #D4AF37;
            --bg-light: #FAF7F2;
            --text-dark: #2B2625;
            --shadow-sm: 0 4px 15px rgba(128, 0, 32, 0.06);
            --shadow-lg: 0 12px 35px rgba(128, 0, 32, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-light); color: var(--text-dark); line-height: 1.6; }
        h1, h2, h3, .brand-font { font-family: 'Cinzel', serif; }

        /* Admin Header */
        header { background: #ffffff; box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 1000; }
        .navbar { max-width: 1240px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 12px 25px; }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--primary); }
        .logo-img { height: 44px; width: 44px; object-fit: cover; border-radius: 50%; border: 2px solid var(--accent); }
        .logo-text { font-size: 20px; font-weight: 800; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 25px; }
        .form-card { background: #ffffff; border-radius: 16px; padding: 35px; box-shadow: var(--shadow-lg); border: 1px solid rgba(212, 175, 55, 0.2); }
        .form-title { font-size: 26px; color: var(--primary); margin-bottom: 25px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 11px 14px; border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; font-size: 15px; outline: none; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .checkbox-group input { width: 18px; height: 18px; }

        .btn-save { background: var(--primary); color: #ffffff; border: none; padding: 14px 28px; border-radius: 6px; font-weight: 700; font-size: 16px; cursor: pointer; }
        .btn-cancel { background: var(--bg-light); color: var(--text-dark); text-decoration: none; padding: 14px 28px; border-radius: 6px; font-weight: 600; margin-left: 10px; }

        /* Mobile Responsive Rules (< 768px) */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden !important;
                width: 100% !important;
                max-width: 100vw !important;
            }

            .navbar {
                flex-direction: column !important;
                padding: 10px 15px !important;
                gap: 10px !important;
            }

            .nav-links {
                flex-wrap: wrap !important;
                justify-content: center !important;
                gap: 6px 8px !important;
                width: 100% !important;
            }

            .container {
                padding: 0 12px !important;
                margin: 15px auto !important;
                width: 100% !important;
            }

            .form-card {
                padding: 20px 14px !important;
            }

            .form-title {
                font-size: 20px !important;
                margin-bottom: 18px !important;
            }

            .form-row {
                grid-template-columns: 1fr !important;
                gap: 12px !important;
            }

            .btn-save, .btn-cancel {
                width: 100% !important;
                display: block !important;
                text-align: center !important;
                margin: 8px 0 0 0 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <nav class="navbar">
            <a th:href="@{/}" class="logo">
                <img th:src="@{/images/logo.jpg}" alt="Siddhi Paithani Logo" class="logo-img" />
                <span class="logo-text brand-font">SIDDHI ADMIN</span>
            </a>
            <ul class="nav-links" style="display:flex; align-items:center; gap:15px; list-style:none; margin:0;">
                <li><a th:href="@{/admin/dashboard}" style="text-decoration:none; color:var(--text-dark); font-weight:600; font-size:14px;"><i class="fa-solid fa-chart-line me-1"></i> Dashboard</a></li>
                <li><a th:href="@{/admin/products}" style="text-decoration:none; color:var(--primary); font-weight:700; font-size:14px;"><i class="fa-solid fa-store me-1"></i> Manage Products</a></li>
                <li><a th:href="@{/admin/orders}" style="text-decoration:none; color:var(--text-dark); font-weight:600; font-size:14px;"><i class="fa-solid fa-receipt me-1"></i> Customer Orders</a></li>
                <li><a th:href="@{/customers}" style="text-decoration:none; color:var(--text-dark); font-weight:600; font-size:14px;"><i class="fa-solid fa-users me-1"></i> Customer List</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="form-card">
            <h1 class="form-title brand-font" th:text="${product.id != null ? 'Edit Saree Product' : 'Add New Paithani Saree'}">Add New Paithani Saree</h1>

            <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label class="form-label">Saree Product Title *</label>
                    <input type="text" th:field="*{name}" required class="form-control" placeholder="e.g. Maharani Pure Gold Zari Yeola Paithani" />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Category *</label>
                        <select th:field="*{category}" class="form-control" required>
                            <option value="Yeola Paithani">Yeola Paithani</option>
                            <option value="Maharani Paithani">Maharani Paithani</option>
                            <option value="Peshwai Silk">Peshwai Silk</option>
                            <option value="Kadiyal Paithani">Kadiyal Paithani</option>
                            <option value="Semi Silk">Semi Silk</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Price (INR ₹) *</label>
                        <input type="number" step="0.01" th:field="*{price}" required class="form-control" placeholder="25000.00" />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Product Image URL *</label>
                    <input type="url" th:field="*{imageUrl}" required class="form-control" placeholder="https://images.unsplash.com/..." />
                </div>

                <div class="form-group">
                    <label class="form-label">Description *</label>
                    <textarea th:field="*{description}" rows="4" required class="form-control" placeholder="Detailed saree description, zari pattern, pallu motifs..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Color</label>
                        <input type="text" th:field="*{color}" class="form-control" placeholder="e.g. Royal Purple" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fabric</label>
                        <input type="text" th:field="*{fabric}" class="form-control" placeholder="e.g. 100% Handloom Mulberry Silk" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Stock Quantity *</label>
                        <input type="number" th:field="*{stock}" required class="form-control" placeholder="10" />
                    </div>
                    <div class="form-group">
                        <div class="checkbox-group" style="margin-top: 32px;">
                            <input type="checkbox" th:field="*{featured}" id="featuredCheck" />
                            <label for="featuredCheck" style="font-weight:700;">Feature on Homepage</label>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 30px;">
                    <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk me-1"></i> Save Product</button>
                    <a th:href="@{/admin/products}" class="btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
