<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forgot Password | Siddhi Paithani</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #800020;
            --primary-dark: #5c0017;
            --accent: #D4AF37;
            --bg-light: #FAF7F2;
            --text-dark: #2B2625;
            --text-muted: #6e6765;
            --shadow-lg: 0 12px 35px rgba(128, 0, 32, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        html, body {
            width: 100%; max-width: 100vw; overflow-x: hidden;
            background: var(--bg-light); color: var(--text-dark);
            min-height: 100vh; display: flex; flex-direction: column;
        }

        h1, h2, h3, .brand-font { font-family: 'Cinzel', serif; }

        /* Top Announcement Bar */
        .top-bar-wrapper {
            background: linear-gradient(90deg, #5c0017, #800020);
            color: #D4AF37; width: 100%; border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }
        .top-bar-inner {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1280px; margin: 0 auto; padding: 6px 16px; font-size: 11.5px; font-weight: 600; width: 100%;
        }

        /* Header */
        .main-header {
            width: 100%; background: #ffffff; position: sticky; top: 0; z-index: 1000;
            border-bottom: 2px solid var(--accent); box-shadow: 0 4px 20px rgba(128, 0, 32, 0.08);
        }
        .navbar {
            max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between;
            align-items: center; padding: 10px 16px; width: 100%;
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--primary); }
        .logo-img { height: 42px; width: 42px; border-radius: 50%; border: 2px solid var(--accent); }
        .logo-text { font-size: 18px; font-weight: 800; }

        /* Container */
        .page-container {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 30px 14px; width: 100%;
        }

        .auth-card {
            background: #ffffff; width: 100%; max-width: 480px; border-radius: 16px;
            box-shadow: var(--shadow-lg); border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 32px 24px; position: relative;
        }

        .card-header { text-align: center; margin-bottom: 24px; }
        .icon-circle {
            width: 60px; height: 60px; background: rgba(128, 0, 32, 0.08); color: var(--primary);
            border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
            font-size: 24px; margin-bottom: 12px; border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .card-title { font-size: 22px; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
        .card-subtitle { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

        .form-group { margin-bottom: 20px; width: 100%; }
        .form-label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        
        .form-control {
            width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid #d4c8b8;
            font-size: 15px; background: #faf8f5; color: var(--text-dark); outline: none;
            transition: all 0.2s ease;
        }
        .form-control:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 3px rgba(128, 0, 32, 0.08); }

        .btn-submit {
            width: 100%; min-height: 48px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #ffffff; border: 1px solid var(--accent); padding: 12px; border-radius: 8px;
            font-weight: 800; font-size: 14.5px; cursor: pointer; transition: all 0.25s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover { background: var(--primary-dark); }

        .alert-box {
            padding: 12px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 13px;
            font-weight: 600; display: flex; align-items: center; gap: 8px;
        }
        .alert-danger { background: #fdf2f2; color: #9b1c1c; border: 1px solid #f8b4b4; }
        .alert-success { background: #f3faf7; color: #03543f; border: 1px solid #84e1bc; }

        .back-link {
            display: block; text-align: center; margin-top: 20px; color: var(--primary);
            font-weight: 700; font-size: 13px; text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .auth-card { padding: 22px 16px; border-radius: 12px; }
            .top-bar-inner { flex-direction: column; text-align: center; }
            .navbar { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar-wrapper">
        <div class="top-bar-inner">
            <span>✨ ELEGANCE HANDWOVEN IN PURE SILK | FREE PAN-INDIA SHIPPING ✨</span>
        </div>
    </div>

    <!-- Header -->
    <header class="main-header">
        <nav class="navbar">
            <a th:href="@{/}" class="logo">
                <img th:src="@{/images/logo.jpg}" alt="Siddhi Paithani Logo" class="logo-img" />
                <span class="logo-text brand-font">SIDDHI PAITHANI</span>
            </a>
        </nav>
    </header>

    <!-- Page Container -->
    <div class="page-container">
        <div class="auth-card">
            <div class="card-header">
                <div class="icon-circle">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h1 class="card-title brand-font">Forgot Password?</h1>
                <p class="card-subtitle">Enter your registered email address below. We will send you a 6-digit Security OTP code to reset your password.</p>
            </div>

            <!-- Alerts -->
            <div th:if="${error}" class="alert-box alert-danger">
                <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}"></span>
            </div>
            <div th:if="${success}" class="alert-box alert-success">
                <i class="fa-solid fa-circle-check"></i> <span th:text="${success}"></span>
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <label class="form-label">Registered Email Address *</label>
                    <input type="email" name="email" required class="form-control" placeholder="name@example.com" autofocus />
                </div>

                <button type="submit" class="btn-submit brand-font">
                    <i class="fa-solid fa-paper-plane"></i> SEND PASSWORD RESET OTP
                </button>
            </form>

            <a th:href="@{/login}" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Sign In
            </a>
        </div>
    </div>

</body>
</html>
