services:
  # Backend API Service (Spring Boot)
  - type: web
    name: siddhi-paithani-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JPA_DDL_AUTO
        value: update
      - key: UPI_ID
        value: 7219120935@ybl
      - key: UPI_NAME
        value: Siddhi Paithani

  # Frontend Web Interface Service (Node.js / Static UI)
  - type: web
    name: siddhi-paithani-frontend
    env: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: siddhi-paithani-backend
          property: host

