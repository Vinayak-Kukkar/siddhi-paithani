version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: siddhi_paithani_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: siddhi_paithani
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Java Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siddhi_paithani_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:mysql://db:3306/siddhi_paithani?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      JPA_DDL_AUTO: update
      PORT: 8084
      UPI_ID: 7219120935@ybl
      UPI_NAME: Siddhi Paithani

  # Node.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siddhi_paithani_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      BACKEND_URL: http://backend:8084

volumes:
  db_data:
